# Source: airflow/templates/configmaps/configmap.yaml
################################
## Airflow ConfigMap
#################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-config
  labels:
    tier: airflow
    component: config
    release: airflow
    chart: "airflow-1.22.0"
    heritage: Helm
data:
  # These are system-specified config overrides.
  airflow.cfg: |-
    [celery]
    flower_url_prefix = 
    sync_parallelism = 0
    worker_concurrency = 16
    
    [celery_kubernetes_executor]
    kubernetes_queue = kubernetes
    
    [core]
    auth_manager = airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    dags_folder = /opt/airflow/dags
    execution_api_server_url = http://airflow-api-server:8080/execution/
    executor = KubernetesExecutor
    load_examples = False
    
    [dag_processor]
    dag_bundle_config_list = [{"classpath":"airflow.dag_processing.bundles.local.LocalDagBundle","kwargs":{},"name":"dags-folder"}]
    
    [elasticsearch]
    json_format = True
    log_id_template = {dag_id}-{task_id}-{run_id}-{map_index}-{try_number}
    
    [elasticsearch_configs]
    max_retries = 3
    retry_timeout = True
    timeout = 30
    
    [fab]
    enable_proxy_fix = True
    
    [kerberos]
    ccache = /var/kerberos-ccache/cache
    keytab = /etc/airflow.keytab
    principal = airflow@FOO.COM
    reinit_frequency = 3600
    
    [kubernetes_executor]
    multi_namespace_mode = False
    namespace = airflow
    pod_template_file = /opt/airflow/pod_templates/pod_template_file.yaml
    worker_container_repository = apache/airflow
    worker_container_tag = 3.2.2
    
    [logging]
    colored_console_log = False
    remote_logging = False
    
    [metrics]
    otel_host = 
    otel_on = False
    otel_port = 4318
    statsd_host = airflow-statsd
    statsd_on = True
    statsd_port = 9125
    statsd_prefix = airflow
    
    [scheduler]
    standalone_dag_processor = True
    
    [traces]
    otel_on = False
    
    [webserver]
    enable_proxy_fix = True
    
  airflow_local_settings.py: |-
    
  pod_template_file.yaml: |-
    
    ---
    apiVersion: v1
    kind: Pod
    metadata:
      name: placeholder-name
      labels:
        tier: airflow
        component: worker
        release: airflow
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      initContainers:
      containers:
        - envFrom:      
            []
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: "KubernetesExecutor"      
            # Hard Coded Airflow Envs
            - name: AIRFLOW_HOME
              value: /opt/airflow
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: airflow-fernet-key
                  key: fernet-key
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              valueFrom:
                secretKeyRef:
                  name: airflow-metadata
                  key: connection
            - name: AIRFLOW_CONN_AIRFLOW_DB
              valueFrom:
                secretKeyRef:
                  name: airflow-metadata
                  key: connection
            - name: AIRFLOW__API__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: airflow-api-secret-key
                  key: api-secret-key      
            # Dynamically created environment variables
            # Dynamically created secret envs
            # Extra env      
          image: apache/airflow:3.2.2
          imagePullPolicy: IfNotPresent
          securityContext: 
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          name: base
          resources:
            {}
          volumeMounts:
            - mountPath: "/opt/airflow/logs"
              name: logs
            - name: config
              mountPath: "/opt/airflow/airflow.cfg"
              subPath: airflow.cfg
              readOnly: true
            - name: config
              mountPath: "/opt/airflow/config/airflow_local_settings.py"
              subPath: airflow_local_settings.py
              readOnly: true
            - mountPath: /opt/airflow/dags
              name: airflow-dags
              readOnly: true
      imagePullSecrets:
        []
      restartPolicy: Never
      securityContext: 
        
        runAsUser: 50000
        fsGroup: 0
      nodeSelector:
        {}
      affinity:
        {}
      terminationGracePeriodSeconds: 600
      tolerations:
        []
      topologySpreadConstraints:
        []
      serviceAccountName: "airflow-worker"
      
      volumes:
      - emptyDir:
          {}
        name: logs
      - configMap:
          name: airflow-config
        name: config
      - configMap:
          name: airflow-dags
        name: airflow-dags
    


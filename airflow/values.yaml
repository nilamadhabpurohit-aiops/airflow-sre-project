executor: KubernetesExecutor

postgresql:
  enabled: false

redis:
  enabled: false

data:
  metadataConnection:
    user: airflow
    pass: airflowpass
    protocol: postgresql
    host: postgres
    port: 5432
    db: airflow
    sslmode: disable

dags:
  gitSync:
    enabled: true
    repo: https://github.com/nilamadhabpurohit-aiops/airflow-sre-project.git
    branch: main
    ref: main
    rev: HEAD
    subPath: airflow/dags
    depth: 1
    period: 5s

webserver:
  replicas: 1

scheduler:
  replicas: 1

apiServer:
  replicas: 1

dagProcessor:
  replicas: 1

triggerer:
  replicas: 1

# Restore normal KubernetesExecutor worker-pod cleanup after diagnosis.
config:
  kubernetes_executor:
    delete_worker_pods: "True"

# Map the Secret's POSTGRES_* keys to the PG* names used by customer_pipeline.py.
extraEnv: |
  - name: PGUSER
    valueFrom:
      secretKeyRef:
        name: analytics-db-secret
        key: POSTGRES_USER
  - name: PGPASSWORD
    valueFrom:
      secretKeyRef:
        name: analytics-db-secret
        key: POSTGRES_PASSWORD
  - name: PGDATABASE
    valueFrom:
      secretKeyRef:
        name: analytics-db-secret
        key: POSTGRES_DB

logs:
  persistence:
    enabled: false

allowPodLaunching: true